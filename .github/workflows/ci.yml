# Build matrix for platform-nes: NES ROM + GameCube/Wii .dol + 3DS .3dsx +
# WebAssembly + three desktop targets.
#
# Local reproduction:
#   The `nes`, `gc`, `wii`, `web`, `ctr` and `linux` jobs are just
#   `docker compose run` against the images in docker/, so they reproduce
#   locally byte-for-byte:
#
#       docker compose run --rm build-nes      # == the `nes` job
#       docker compose run --rm build-gc       # == the `gc` job
#       docker compose run --rm build-wii      # == the `wii` job
#       docker compose run --rm build-web      # == the `web` job
#       docker compose run --rm build-3ds      # == the `ctr` job
#       docker compose run --rm build-switch   # == the `switch` job
#       docker compose run --rm build-nds      # == the `nds` job
#       docker compose run --rm build-dsi      # == the `dsi` job
#       docker compose run --rm build-gba      # == the `gba` job
#       docker compose run --rm build-linux    # == the `linux` job's compile
#
#   To run the workflow itself locally, use act (https://github.com/nektos/act),
#   which executes Linux-container jobs against the host Docker daemon:
#
#       act -j nes
#       act -j gc
#       act -j wii
#       act -j web
#       act -j ctr
#       act -j switch
#       act -j nds
#       act -j dsi
#       act -j gba
#       act -j linux
#
#   act cannot emulate GitHub's macOS/Windows runners, so the `mac` and `win`
#   jobs are GitHub-hosted only -- there is no local equivalent on a Linux box.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Newer pushes to the same ref cancel in-flight runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nes:
    name: NES (ROM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # FetchContent (intsh/tuple) + the FamiStudio download land in the build
      # tree; caching it across runs skips re-cloning and re-measuring.
      - name: Cache build tree
        uses: actions/cache@v5
        with:
          path: cmake-build-ci-nes-release
          key: nes-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'docker/Dockerfile.nes') }}
          restore-keys: nes-

      - name: Build demo.nes
        run: docker compose run --rm --build build-nes

      - uses: actions/upload-artifact@v7
        with:
          name: demo-nes
          path: cmake-build-ci-nes-release/demo.nes
          if-no-files-found: error

  gc:
    name: GameCube (.dol)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache build tree
        uses: actions/cache@v5
        with:
          path: cmake-build-ci-gc-release
          key: gc-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'docker/Dockerfile.ogc') }}
          restore-keys: gc-

      - name: Build demo.dol
        run: docker compose run --rm --build build-gc

      - uses: actions/upload-artifact@v7
        with:
          name: demo-gamecube
          path: cmake-build-ci-gc-release/demo.dol
          if-no-files-found: error

  wii:
    name: Wii (.dol)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache build tree
        uses: actions/cache@v5
        with:
          path: cmake-build-ci-wii-release
          key: wii-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'docker/Dockerfile.ogc') }}
          restore-keys: wii-

      - name: Build demo.dol
        run: docker compose run --rm --build build-wii

      - uses: actions/upload-artifact@v7
        with:
          name: demo-wii
          path: cmake-build-ci-wii-release/demo.dol
          if-no-files-found: error

  web:
    name: Web (WASM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache build tree
        uses: actions/cache@v5
        with:
          path: cmake-build-ci-web-release
          key: web-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'docker/Dockerfile.web') }}
          restore-keys: web-

      - name: Build demo.html
        run: docker compose run --rm --build build-web

      # The web build emits an interdependent set (HTML shell + JS glue + wasm +
      # the MEMFS asset blob); upload all four so the artifact is runnable.
      - uses: actions/upload-artifact@v7
        with:
          name: demo-web
          path: |
            cmake-build-ci-web-release/demo.html
            cmake-build-ci-web-release/demo.js
            cmake-build-ci-web-release/demo.wasm
            cmake-build-ci-web-release/demo.data
          if-no-files-found: error

      # Stage a clean directory for Cloudflare Pages: just the four runtime files
      # plus the _headers caching rules. demo.html becomes index.html so the bare
      # site URL works (the .js still references demo.{js,wasm,data} by basename,
      # which the rename does not touch). The CMake build dir is NOT deployed
      # wholesale -- it carries the entire CMake tree.
      - name: Stage Pages site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p dist
          cp cmake-build-ci-web-release/demo.html dist/index.html
          cp cmake-build-ci-web-release/demo.js   dist/
          cp cmake-build-ci-web-release/demo.wasm dist/
          cp cmake-build-ci-web-release/demo.data dist/
          cp web/_headers                         dist/

      # Deploy to Cloudflare Pages (free, unmetered bandwidth, global CDN). Only
      # on push to main -- PRs (incl. forks, which lack the secrets) just build.
      # Requires repo secrets CLOUDFLARE_API_TOKEN (token with the
      # "Cloudflare Pages: Edit" permission) and CLOUDFLARE_ACCOUNT_ID, and a
      # Pages project named platform-nes-demo (production branch: main).
      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=platform-nes-demo --branch=main

  ctr:
    name: 3DS (.3dsx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache build tree
        uses: actions/cache@v5
        with:
          path: cmake-build-ci-ctr-release
          key: ctr-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'docker/Dockerfile.3ds') }}
          restore-keys: ctr-

      - name: Build demo.3dsx
        run: docker compose run --rm --build build-3ds

      - uses: actions/upload-artifact@v7
        with:
          name: demo-3ds
          path: cmake-build-ci-ctr-release/demo.3dsx
          if-no-files-found: error

  switch:
    name: Switch (.nro)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache build tree
        uses: actions/cache@v5
        with:
          path: cmake-build-ci-switch-release
          key: switch-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'docker/Dockerfile.switch') }}
          restore-keys: switch-

      - name: Build demo.nro
        run: docker compose run --rm --build build-switch

      - uses: actions/upload-artifact@v7
        with:
          name: demo-switch
          path: cmake-build-ci-switch-release/demo.nro
          if-no-files-found: error

  nds:
    name: Nintendo DS (.nds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache build tree
        uses: actions/cache@v5
        with:
          path: cmake-build-ci-nds-release
          key: nds-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'docker/Dockerfile.nds') }}
          restore-keys: nds-

      - name: Build demo.nds
        run: docker compose run --rm --build build-nds

      - uses: actions/upload-artifact@v7
        with:
          name: demo-nds
          path: cmake-build-ci-nds-release/demo.nds
          if-no-files-found: error

  dsi:
    name: Nintendo DSi (.nds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache build tree
        uses: actions/cache@v5
        with:
          path: cmake-build-ci-dsi-release
          key: dsi-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'docker/Dockerfile.nds') }}
          restore-keys: dsi-

      - name: Build demo.nds (DSi)
        run: docker compose run --rm --build build-dsi

      - uses: actions/upload-artifact@v7
        with:
          name: demo-dsi
          path: cmake-build-ci-dsi-release/demo.nds
          if-no-files-found: error

  gba:
    name: Game Boy Advance (.gba)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache build tree
        uses: actions/cache@v5
        with:
          path: cmake-build-ci-gba-release
          key: gba-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'docker/Dockerfile.gba') }}
          restore-keys: gba-

      - name: Build demo.gba
        run: docker compose run --rm --build build-gba

      - uses: actions/upload-artifact@v7
        with:
          name: demo-gba
          path: cmake-build-ci-gba-release/demo.gba
          if-no-files-found: error

  wiiu:
    name: Wii U (.rpx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache build tree
        uses: actions/cache@v5
        with:
          path: cmake-build-ci-wiiu-release
          key: wiiu-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'docker/Dockerfile.wiiu') }}
          restore-keys: wiiu-

      # Builds the homebrew .rpx/.wuhb AND assembles the installable-title
      # (demo-wup): the unpacked code/content/meta tree, plus a packed WUP when
      # the optional WIIU_COMMON_KEY secret is present. The key is copyrighted, so
      # forks/PRs without the secret simply get the tree (NUSPacker is skipped) --
      # the build never fails for lack of a key.
      - name: Build demo.rpx + WUP
        env:
          WIIU_COMMON_KEY: ${{ secrets.WII_U_COMMON_KEY }}
        run: docker compose run --rm --build -e WIIU_COMMON_KEY build-wiiu

      - uses: actions/upload-artifact@v7
        with:
          name: demo-wiiu
          path: |
            cmake-build-ci-wiiu-release/demo.rpx
            cmake-build-ci-wiiu-release/demo.wuhb
          if-no-files-found: error

      # The installable-title outputs: the unpacked tree (always) and the packed
      # WUP (only when the common-key secret was set). Don't fail if the WUP is
      # absent -- the tree alone is a valid artifact users can pack themselves.
      - uses: actions/upload-artifact@v7
        with:
          name: demo-wiiu-wup
          path: |
            cmake-build-ci-wiiu-release/wup
            cmake-build-ci-wiiu-release/wup-installable
          if-no-files-found: warn

  linux:
    name: Linux (AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache build tree
        uses: actions/cache@v5
        with:
          path: cmake-build-ci-linux-release
          key: linux-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'docker/Dockerfile.linux') }}
          restore-keys: linux-

      # Override the service command to drive the demo-appimage target (which
      # depends on demo), inside the same image the local `build-linux` uses.
      - name: Build AppImage
        run: |
          docker compose run --rm --build build-linux bash -c '
            set -euo pipefail
            cmake --preset linux-release -B cmake-build-ci-linux-release
            cmake --build cmake-build-ci-linux-release --target demo-appimage -j"$(nproc)"
          '

      - uses: actions/upload-artifact@v7
        with:
          name: demo-linux-appimage
          path: cmake-build-ci-linux-release/*.AppImage
          if-no-files-found: error

  mac:
    name: macOS (app)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        run: brew install ninja

      - name: Cache build tree
        uses: actions/cache@v5
        with:
          path: cmake-build-mac-release
          key: mac-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json') }}
          restore-keys: mac-

      - name: Build demo
        run: |
          cmake --preset mac-release
          cmake --build cmake-build-mac-release -j"$(sysctl -n hw.ncpu)"

      - uses: actions/upload-artifact@v7
        with:
          name: demo-macos
          path: |
            cmake-build-mac-release/demo
            cmake-build-mac-release/tracks
            cmake-build-mac-release/sfx
          if-no-files-found: error

  win:
    name: Windows (exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Set up the MSVC developer environment: provides the Windows SDK headers/
      # libs and puts Visual Studio's bundled Ninja on PATH. clang (preinstalled
      # on the runner) then targets the MSVC ABI while still accepting the GNU
      # compound-literal / gnu++23 extensions the engine relies on -- which cl
      # would reject.
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache build tree
        uses: actions/cache@v5
        with:
          path: cmake-build-win-release
          key: win-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json') }}
          restore-keys: win-

      - name: Build demo
        shell: cmd
        run: |
          cmake --preset win-release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          cmake --build cmake-build-win-release -j

      - uses: actions/upload-artifact@v7
        with:
          name: demo-windows
          path: |
            cmake-build-win-release/demo.exe
            cmake-build-win-release/tracks
            cmake-build-win-release/sfx
          if-no-files-found: error
