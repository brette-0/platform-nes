# Cross-platform build entry point for platform-nes.
#
# Run from the repository root, in any shell (PowerShell, bash, zsh, cmd):
#
#   docker compose run --rm build-linux     # Linux desktop demo
#   docker compose run --rm build-nes       # NES ROM (demo.nes)
#   docker compose run --rm build-gc        # GameCube demo.dol
#   docker compose run --rm build-wii       # Wii demo.dol (also runs on Wii U / vWii)
#   docker compose run --rm build-web       # WebAssembly demo.html (+ .js/.wasm/.data)
#   docker compose run --rm build-3ds       # Nintendo 3DS demo.3dsx
#
# Override the preset by setting PRESET in the environment:
#
#   PRESET=linux-debug docker compose run --rm build-linux          # bash
#   $env:PRESET="linux-debug"; docker compose run --rm build-linux  # PowerShell
#
# Output is written to ./cmake-build-<preset-name> in the repository root.
# These are the same commands CI runs (.github/workflows/ci.yml), so the
# Linux and NES jobs reproduce locally byte-for-byte (also via `act -j ...`).
#
# File ownership of the build output:
#   The containers run as ${UID}:${GID}, defaulting to 0:0 (root) when those
#   are unset -- which is what CI uses, so CI output stays root-owned exactly as
#   before. To make LOCAL output owned by you (so you can delete build trees
#   without sudo), pass your ids on the command line:
#
#       UID=$(id -u) GID=$(id -g) docker compose run --rm build-gc
#
#   or, to avoid repeating it, create an uncommitted .env in the repo root once:
#
#       printf 'UID=%s\nGID=%s\n' "$(id -u)" "$(id -g)" > .env
#
#   Compose auto-loads .env; it is gitignored so it never reaches CI's checkout
#   (CI then falls back to the 0:0 default). $HOME is pointed at /tmp because a
#   non-root uid has no home directory inside the image.

services:
  build-nes:
    build:
      context: docker
      dockerfile: Dockerfile.nes
    image: platform-nes-nes:trixie
    user: "${UID:-0}:${GID:-0}"
    working_dir: /tmp/platform-nes
    volumes:
      - .:/tmp/platform-nes
    environment:
      PRESET: ${PRESET:-nes-release}
      HOME: /tmp
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        # Pass the toolchain + prefix explicitly from the image's SDK rather
        # than letting CMakeLists derive them from LLVM_MOS_SDK: a developer's
        # bind-mounted local.cmake FORCEs that variable to a host path that
        # doesn't exist inside the container. Build into a dedicated dir so the
        # container never clashes with an IDE-configured cmake-build-nes-* tree
        # (their CMakeCache.txt records a different, host source path).
        cmake --preset "$$PRESET" -B "cmake-build-ci-$$PRESET" \
          -DCMAKE_TOOLCHAIN_FILE="$$LLVM_MOS_SDK/lib/cmake/llvm-mos-sdk/llvm-mos-toolchain.cmake" \
          -DCMAKE_PREFIX_PATH="$$LLVM_MOS_SDK"
        cmake --build "cmake-build-ci-$$PRESET" -j"$$(nproc)"
        echo "Built: cmake-build-ci-$$PRESET/demo.nes"

  build-linux:
    build:
      context: docker
      dockerfile: Dockerfile.linux
    image: platform-nes-linux:bullseye
    user: "${UID:-0}:${GID:-0}"
    working_dir: /tmp/platform-nes
    volumes:
      - .:/tmp/platform-nes
    environment:
      PRESET: ${PRESET:-linux-release}
      HOME: /tmp
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        # Dedicated build dir (see build-nes) so the container never clashes
        # with an IDE-configured cmake-build-linux-* tree on the host mount.
        cmake --preset "$$PRESET" -B "cmake-build-ci-$$PRESET"
        cmake --build "cmake-build-ci-$$PRESET" -j"$$(nproc)"
        echo "Built: cmake-build-ci-$$PRESET/demo"

  build-web:
    build:
      context: docker
      dockerfile: Dockerfile.web
    image: platform-nes-web:latest
    user: "${UID:-0}:${GID:-0}"
    working_dir: /tmp/platform-nes
    volumes:
      - .:/tmp/platform-nes
    environment:
      PRESET: ${PRESET:-web-release}
      HOME: /tmp
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        # The web-* preset points CMAKE_TOOLCHAIN_FILE at the image's
        # Emscripten.cmake (via $$EMSDK), so a plain cmake --preset suffices --
        # no emcmake wrapper needed. Dedicated build dir (see build-nes) so the
        # container never clashes with an IDE-configured tree on the host mount.
        cmake --preset "$$PRESET" -B "cmake-build-ci-$$PRESET"
        cmake --build "cmake-build-ci-$$PRESET" -j"$$(nproc)"
        echo "Built: cmake-build-ci-$$PRESET/demo.html"

  # GameCube + Wii share one image (devkitPPC + libogc); the preset selects the
  # console toolchain (GameCube.cmake vs Wii.cmake). The gc-/wii-release presets
  # already point CMAKE_TOOLCHAIN_FILE at $DEVKITPRO/cmake/*, and DEVKITPRO is
  # exported by the base image, so no explicit -DCMAKE_TOOLCHAIN_FILE is needed
  # (unlike build-nes, whose SDK path can't be derived from a bind-mounted
  # local.cmake). The OGC branch never reads LLVM_MOS_SDK, so a forced value in a
  # developer's local.cmake is inert here.
  build-gc:
    build:
      context: docker
      dockerfile: Dockerfile.ogc
    image: platform-nes-ogc:latest
    user: "${UID:-0}:${GID:-0}"
    working_dir: /tmp/platform-nes
    volumes:
      - .:/tmp/platform-nes
    environment:
      PRESET: ${PRESET:-gc-release}
      HOME: /tmp
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        cmake --preset "$$PRESET" -B "cmake-build-ci-$$PRESET"
        cmake --build "cmake-build-ci-$$PRESET" -j"$$(nproc)"
        echo "Built: cmake-build-ci-$$PRESET/demo.dol"

  build-wii:
    build:
      context: docker
      dockerfile: Dockerfile.ogc
    image: platform-nes-ogc:latest
    user: "${UID:-0}:${GID:-0}"
    working_dir: /tmp/platform-nes
    volumes:
      - .:/tmp/platform-nes
    environment:
      PRESET: ${PRESET:-wii-release}
      HOME: /tmp
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        cmake --preset "$$PRESET" -B "cmake-build-ci-$$PRESET"
        cmake --build "cmake-build-ci-$$PRESET" -j"$$(nproc)"
        echo "Built: cmake-build-ci-$$PRESET/demo.dol"

  # Nintendo 3DS (devkitARM + libctru + citro2d). The ctr-release preset points
  # CMAKE_TOOLCHAIN_FILE at $DEVKITPRO/cmake/3DS.cmake, and DEVKITPRO is exported
  # by the base image, so no explicit -DCMAKE_TOOLCHAIN_FILE is needed (unlike
  # build-nes). The backend renders the shared software PPU to one RGBA texture
  # via citro2d (the PICA200 has no paletted textures), so it never reads
  # LLVM_MOS_SDK and a forced value in a developer's local.cmake is inert here.
  build-3ds:
    build:
      context: docker
      dockerfile: Dockerfile.3ds
    image: platform-nes-3ds:latest
    user: "${UID:-0}:${GID:-0}"
    working_dir: /tmp/platform-nes
    volumes:
      - .:/tmp/platform-nes
    environment:
      PRESET: ${PRESET:-ctr-release}
      HOME: /tmp
    command:
      - bash
      - -c
      - |
        set -euo pipefail
        cmake --preset "$$PRESET" -B "cmake-build-ci-$$PRESET"
        cmake --build "cmake-build-ci-$$PRESET" -j"$$(nproc)"
        echo "Built: cmake-build-ci-$$PRESET/demo.3dsx"
